name: Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Generate Release Keystore if missing
        run: |
          if [ ! -f app/android/app/todocat.jks ]; then
            keytool -genkeypair -v -keystore app/android/app/todocat.jks -alias todocat -keyalg RSA -keysize 2048 -validity 10000 -storepass todocat123 -keypass todocat123 -dname "CN=TodoCat, OU=Mobile, O=TodoCat, C=US"
          fi

      - name: Build Android APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release

      - name: Package & Name APK
        run: |
          VERSION=$(grep 'version:' app/pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)
          cp app/build/app/outputs/flutter-apk/app-release.apk "TodoCat-${VERSION}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: TodoCat-*.apk

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Build macOS App
        run: |
          cd app
          flutter pub get
          flutter build macos --release

      - name: Package macOS DMG
        run: |
          VERSION=$(grep 'version:' app/pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)
          APP_PATH="app/build/macos/Build/Products/Release/TodoCat.app"
          STAGING_DIR="app/build/dmg_staging"
          OUTPUT_DMG="TodoCat-${VERSION}-macos.dmg"

          rm -rf "$STAGING_DIR" "$OUTPUT_DMG"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create -volname "TodoCat" -srcfolder "$STAGING_DIR" -ov -format UDZO "$OUTPUT_DMG"
          rm -rf "$STAGING_DIR"
          hdiutil verify "$OUTPUT_DMG"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: TodoCat-*-macos.dmg

  build-linux:
    name: Build Linux AppImage & Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Build Linux App
        run: |
          cd app
          flutter pub get
          flutter build linux --release

      - name: Package AppImage & Tarball
        run: |
          VERSION=$(grep 'version:' app/pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)
          BUNDLE_DIR="app/build/linux/x64/release/bundle"
          APPDIR="TodoCat.AppDir"

          # 1. Prepare AppDir structure
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp -r "$BUNDLE_DIR"/* "$APPDIR/"
          cp app/linux/todocat.desktop "$APPDIR/todocat.desktop"
          cp app/linux/todocat.png "$APPDIR/todocat.png"
          cp app/linux/todocat.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/todocat.png"

          # 2. Create AppRun script
          cat << 'EOF' > "$APPDIR/AppRun"
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/todocat" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # 3. Download appimagetool and build AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sed -i 's|AI\x02|\x00\x00\x00|' appimagetool || true
          ARCH=x86_64 ./appimagetool "$APPDIR" "TodoCat-${VERSION}-x86_64.AppImage"

          # 4. Create Standalone Tarball
          tar -czvf "TodoCat-${VERSION}-linux-x64.tar.gz" -C "$BUNDLE_DIR" .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            TodoCat-*-x86_64.AppImage
            TodoCat-*-linux-x64.tar.gz

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-android, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List Release Files
        run: ls -la release_assets/

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
